<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人形六维能力图 · 少女前线2：追放（纯剧情论战）</title>
<style>
/* ===== tokens ===== */
:root{
  --ink-900:#0a1219; --ink-850:#0d1822; --ink-800:#111d28; --ink-750:#16242f;
  --paper:#eae5da; --paper-2:#c3cdd4; --paper-dim:#8ea3b1; --paper-faint:#67808f;
  --line:rgba(226,232,235,.14); --line-soft:rgba(226,232,235,.07); --line-hard:rgba(226,232,235,.24);
  --amber:#ffb84d; --crimson:#cf5a5f; --teal:#5fb3b0;
  --g0:#9a9088; --g1:#c08a5e; --g2:#b3c0cf; --g3:#5cc4c9; --g4:#7fa8e8; --g5:#b070e0; --g6:#f0c53f; --g7:#e08cff;
  --sp:8px; --r:2px;
  --dsp:'Bahnschrift SemiCondensed','Bahnschrift','DIN Alternate','DIN Condensed','Microsoft YaHei UI',sans-serif;
  --txt:'Segoe UI Variable Text','Segoe UI','Microsoft YaHei UI','PingFang SC',sans-serif;
  --easing:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh; color:var(--paper); font:400 14px/1.6 var(--txt);
  background-color:var(--ink-900);
  background-image:
    radial-gradient(1250px 640px at 13% -10%, var(--bg-glow, rgba(95,179,176,.085)) 0, rgba(10,18,25,0) 62%),
    radial-gradient(880px 480px at 90% 2%, var(--bg-glow2, rgba(229,161,60,.055)) 0, rgba(10,18,25,0) 60%),
    repeating-linear-gradient(0deg, var(--bg-grid, rgba(226,232,235,.032)) 0 1px, rgba(0,0,0,0) 1px 72px),
    repeating-linear-gradient(90deg, var(--bg-grid, rgba(226,232,235,.032)) 0 1px, rgba(0,0,0,0) 1px 72px);
  background-attachment:fixed;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 90% at 50% 40%, rgba(0,0,0,0) 40%, rgba(6,11,16,.34) 100%)}
h1,h2,h3,h4,p,figure{margin:0}
button,input,select{font:inherit;color:inherit}
a{color:var(--teal)}
::selection{background:rgba(229,161,60,.3)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hidden{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== shell ===== */
.shell{position:relative;z-index:1;max-width:1680px;margin:0 auto;padding:0 32px 72px}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:5px;z-index:3;pointer-events:none;
  background:repeating-linear-gradient(90deg,var(--line-hard) 0 1px,rgba(0,0,0,0) 1px 24px)}
.masthead{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:48px;align-items:end;
  padding:56px 0 24px;border-bottom:1px solid var(--line)}
.masthead .kickerline{display:flex;flex-wrap:wrap;gap:6px 20px;color:var(--paper-faint);font-size:12px;letter-spacing:.02em;margin-bottom:14px}
h1{font-family:var(--dsp);font-weight:600;font-size:clamp(34px,4.4vw,60px);line-height:.98;letter-spacing:-.015em;text-transform:none}
h1 em{font-style:normal;color:var(--amber)}
.lede{margin-top:14px;max-width:62ch;color:var(--paper-2);font-size:13.5px}
.readout{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:flex-end;align-items:baseline;
  font-size:12.5px;color:var(--paper-dim);padding-bottom:4px}
.readout div{display:flex;align-items:baseline;gap:7px;padding-left:18px;border-left:1px solid var(--line)}
.readout b{font-family:var(--dsp);font-size:21px;line-height:1;font-variant-numeric:tabular-nums;color:var(--paper)}

.layout{display:grid;grid-template-columns:var(--railw,318px) 8px minmax(0,1fr);gap:0;margin-top:0}
.layout.folded{grid-template-columns:0 8px minmax(0,1fr)}
.layout.folded .rail{display:none}
.rail{border-right:1px solid var(--line);padding:24px 24px 40px 0;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
.plot{padding:24px 0 0 28px;min-width:0}
@media(max-width:1080px){
  .masthead{grid-template-columns:1fr;gap:24px}
  .layout{grid-template-columns:1fr}
  .rail{position:static;border-right:0;border-bottom:1px solid var(--line);padding:16px 0 20px;max-height:none}
  .plot{padding:20px 0 0}
  .railgrip{display:none}
  .layout.folded .rail{display:block}
}

/* ===== controls ===== */
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:11.5px;color:var(--paper-faint);letter-spacing:.04em;margin-bottom:5px}
input[type=text],input[type=search],select,textarea{
  width:100%;background:rgba(234,229,218,.03);border:1px solid var(--line);border-radius:var(--r);
  padding:8px 10px;color:var(--paper);font-size:13.5px}
input::placeholder{color:var(--paper-faint)}
input:focus,select:focus{border-color:var(--amber);background:rgba(229,161,60,.05)}
.btn{background:rgba(234,229,218,.04);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;
  cursor:pointer;font-size:12.5px;color:var(--paper-2);transition:border-color .16s var(--easing),color .16s var(--easing),background .16s var(--easing)}
.btn:hover{border-color:var(--line-hard);color:var(--paper)}
.btn[aria-pressed=true]{border-color:var(--amber);color:var(--amber);background:rgba(229,161,60,.08)}
.btn.solid{background:var(--amber);color:#17110a;border-color:var(--amber);font-weight:600}
.btn.solid:hover{background:#f0ad4a;color:#17110a}
.btn.danger:hover{border-color:var(--crimson);color:var(--crimson)}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.segmented{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.segmented button{flex:1;border:0;background:transparent;padding:8px 6px;cursor:pointer;font-size:12.5px;color:var(--paper-dim)}
.segmented button+button{border-left:1px solid var(--line)}
.segmented button[aria-pressed=true]{background:rgba(229,161,60,.1);color:var(--amber)}

/* ===== index list ===== */
.idxhead{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 8px;font-size:11.5px;color:var(--paper-faint)}
.idxlist{border-top:1px solid var(--line)}
.idxrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:7px 2px;
  border-bottom:1px solid var(--line-soft);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.idxrow:hover{background:rgba(234,229,218,.03)}
.idxrow[aria-current=true]{background:rgba(229,161,60,.07)}
.idxrow .nm{font-size:13px;color:var(--paper-2)}
.idxrow[aria-current=true] .nm{color:var(--paper)}
.idxrow .opp{font-size:10.5px;color:var(--paper-faint)}
.idxrow.foe .nm::before{content:"◆";color:var(--crimson);font-size:9px;margin-right:6px;vertical-align:1px}
.idxrow.self .nm::before{content:"◇";color:var(--teal);font-size:9px;margin-right:6px;vertical-align:1px}
.strip{display:flex;gap:2px}
.strip i{display:block;width:3px;height:12px;background:var(--line-hard)}

/* ===== plot area ===== */
.plotbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
  padding-bottom:16px;border-bottom:1px solid var(--line)}
.tally{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:15px;color:var(--paper-2);font-variant-numeric:tabular-nums;margin-right:auto}
.tally span+span{padding-left:16px;border-left:1px solid var(--line)}
.tally b{color:var(--paper);font-weight:600}
.scale{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--paper-faint);align-items:center}
.scale i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}

/* ===== plates (cards) ===== */
.plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cardminw,292px),1fr));gap:var(--cardgap,1px);background:var(--line-soft);margin-top:1px}
.plate{position:relative;background:linear-gradient(180deg,var(--ink-850),var(--panel-bot,var(--ink-900)) 78%);
  padding:var(--cardpad,16px);display:flex;flex-direction:column;gap:var(--cardigap,12px);
  animation:rise .42s var(--easing) both}
.plate.foe{background:linear-gradient(180deg,#151a20,var(--ink-900) 78%)}
.plate.self{border-left:2px solid var(--acc-self,var(--amber))}
.plate.foe{border-left:2px solid var(--acc-foe,var(--crimson))}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ptop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pname{font-family:var(--dsp);font-size:24px;line-height:1.15;letter-spacing:-.005em}
.pfaction{font-size:11.5px;color:var(--paper-dim);margin-top:3px}
.psrc{font-size:10.5px;color:var(--paper-faint);margin-top:2px}
.mark{font-size:10.5px;letter-spacing:.06em;padding:2px 7px;border:1px solid var(--line);white-space:nowrap;color:var(--paper-dim)}
.mark.self{border-color:rgba(95,179,176,.42);color:var(--teal)}
.mark.foe{border-color:rgba(207,90,95,.45);color:var(--crimson)}
.chart{display:grid;place-items:center;padding:2px 0 0;background:radial-gradient(circle at 50% 48%,rgba(229,161,60,.055),rgba(0,0,0,0) 66%)}
svg.radar{display:block;width:100%;height:auto;overflow:visible;position:relative;z-index:1}
.ring{fill:none;stroke:rgba(226,232,235,.065);stroke-width:1}
.ring.major{stroke:rgba(226,232,235,.20)}
.ring.halo{stroke:rgba(226,232,235,.11);stroke-dasharray:4 6}
.axis{stroke:rgba(226,232,235,.085);stroke-width:1}
.node{fill:rgba(226,232,235,.22)}
.albl{font-family:var(--txt);fill:var(--paper-2);letter-spacing:.03em;paint-order:stroke;stroke:var(--ink-900);stroke-linejoin:round}
.fval{fill:var(--paper-2);font-family:var(--dsp);font-size:9px;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--ink-900);stroke-linejoin:round}
.evidence{font-size:11.5px;line-height:1.55;color:var(--paper-dim);border-left:1px solid var(--line-hard);padding-left:9px}
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;border-top:1px solid var(--line-soft);padding-top:8px}
.led{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:3px 0;border-bottom:1px solid var(--line-soft)}
.led span{font-size:12px;color:var(--paper-dim)}
.led b{font-family:var(--dsp);font-size:15px;font-variant-numeric:tabular-nums}
.pfoot{display:flex;justify-content:space-between;align-items:flex-end;padding-top:10px;border-top:1px solid var(--line)}
.total{font-family:var(--dsp);font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.total small{font-family:var(--txt);font-size:11px;color:var(--paper-faint);margin-left:5px}
.acts{display:flex;gap:6px}
.acts .btn{padding:5px 9px;font-size:12px}

/* ===== compare ===== */
.cmp{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:32px;padding-top:20px}
@media(max-width:1080px){.cmp{grid-template-columns:1fr}}
.slotrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.ledgertable{width:100%;border-collapse:collapse;font-size:13px}
.ledgertable th,.ledgertable td{border-bottom:1px solid var(--line-soft);padding:9px 10px;text-align:left;white-space:nowrap}
.ledgertable thead th{color:var(--paper-faint);font-weight:500;font-size:11.5px;border-bottom-color:var(--line)}
.ledgertable td.g{font-family:var(--dsp);font-size:16px;font-variant-numeric:tabular-nums}
.legendrow{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-size:12px;color:var(--paper-dim)}
.legendrow i{display:inline-block;width:9px;height:9px;margin-right:6px}

/* ===== table view ===== */
.tblwrap{border-top:1px solid var(--line);overflow:auto;max-height:76vh}
table.roster{width:100%;border-collapse:collapse;font-size:13px}
table.roster th,table.roster td{border-bottom:1px solid var(--line-soft);padding:8px 10px;text-align:left;white-space:nowrap}
table.roster thead th{position:sticky;top:0;background:var(--ink-850);color:var(--paper-faint);
  font-weight:500;font-size:11.5px;cursor:pointer;border-bottom-color:var(--line);z-index:2}
table.roster thead th:hover{color:var(--amber)}
table.roster tbody tr:hover{background:rgba(234,229,218,.03)}
table.roster td.g{font-family:var(--dsp);font-size:15px;font-variant-numeric:tabular-nums}
table.roster td.num{font-variant-numeric:tabular-nums}

/* ===== modal ===== */
.scrim{position:fixed;inset:0;background:rgba(5,9,13,.74);z-index:60;display:grid;place-items:center;padding:24px}
.sheet{width:min(720px,100%);max-height:88vh;overflow:auto;background:var(--ink-800);border:1px solid var(--line-hard);
  padding:26px 28px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.sheet h2{font-family:var(--dsp);font-size:26px;font-weight:600;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2 .full{grid-column:1/-1}
.form2{margin-top:16px;border-top:1px solid var(--line-soft);padding-top:12px}
.form2 .f2head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:9px;font-size:11.5px;color:var(--paper-faint)}
.form2 .f2head b{color:var(--paper-2);font-weight:600;font-size:12.5px}
.form2 .f2head select{margin-left:auto;padding:3px 6px;background:var(--ink-900);border:1px solid var(--line);border-radius:2px;color:var(--paper-2);font-size:12px}
.form2 .f2row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:9px}
.form2 .f2vals{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.form2 .f2vals label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--paper-faint)}
.form2 .f2vals input{width:100%;padding:3px 5px;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:2px;color:inherit;font-variant-numeric:tabular-nums}
.sliders{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
.editcmp{display:flex;gap:20px;align-items:flex-start;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.editchart{flex:0 0 290px}.editchart svg{width:290px;height:290px;display:block}
.chartnote{margin-top:7px;font-size:10.5px;line-height:1.55;color:var(--paper-faint);text-align:center;border:1px dashed var(--line);padding:5px 7px;border-radius:3px}
.editmeta{flex:1;min-width:200px}
.editmeta .q{font-size:11.5px;line-height:1.85;color:var(--paper-dim)}
.editmeta b{color:var(--paper);font-size:15px}
.sblock{margin-top:16px;border-top:1px solid var(--line-soft);padding-top:12px}
.sblock .sliders{margin-top:6px;border-top:0;padding-top:0}
.shead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.shead b{font-family:var(--dsp);font-size:15px;color:var(--paper)}
.shead input[type=text]{padding:4px 8px;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:2px;color:inherit;font-size:13.5px;min-width:130px}
.shead .shint{font-size:11.5px;color:var(--paper-faint)}
.shead .suse{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--paper-dim)}
.shead select{margin-left:auto;padding:4px 7px;background:var(--ink-900);border:1px solid var(--line);border-radius:2px;color:var(--paper-2);font-size:12.5px}
.sblock[data-on="0"] .sliders{opacity:.32;pointer-events:none}
.sblock[data-on="0"] .shead select{margin-left:auto}
.editcmp{flex-wrap:wrap}
.srow{display:grid;grid-template-columns:96px 1fr 56px;align-items:center;gap:14px;padding:5px 0}
.srow label{font-size:12.5px;color:var(--paper-dim)}
.srow output{font-family:var(--dsp);font-size:16px;text-align:center;border:1px solid var(--line);padding:1px 0}
input[type=range]{-webkit-appearance:none;appearance:none;height:2px;background:var(--line-hard);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--amber);
  border:0;border-radius:50%;cursor:pointer}
.sheetactions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}

/* ===== notes ===== */
.notes{margin-top:56px;border-top:1px solid var(--line);padding-top:24px;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px;color:var(--paper-dim);font-size:12.5px}
.notes h3{font-size:12px;color:var(--paper-faint);letter-spacing:.06em;margin-bottom:10px}
.notes p+p{margin-top:8px}
.notes b{color:var(--paper-2);font-weight:600}
.empty{padding:64px 24px;text-align:center;color:var(--paper-faint);border:1px dashed var(--line)}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media(max-width:560px){
  .shell{padding:0 16px 56px}
  .plates{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .cmp{gap:20px}
  h1{font-size:34px}
}
@media print{.rail,.acts,.plotbar{display:none}.plate{animation:none}}

.frm{font-size:14px;color:var(--paper-2);margin-top:2px;letter-spacing:0;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.verdict{font-size:11px;color:#c9a15a;border-left:2px solid #7b5a1f;padding-left:8px;margin-top:-4px}
.netbar.kinds{margin-bottom:6px}
.relbtn.kind{font-size:11.5px;padding:3px 8px}
.kbadge{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:2px;padding:0 4px;margin:0 3px;color:var(--paper-faint)}
.kbadge.实战{color:#e5a13c;border-color:#6d5320}
.kbadge.情境,.kbadge.戏言{color:#8b98a8;border-style:dashed}
.kbadge.一次性{color:#5fb3b0;border-color:#1f4a4a}
.kbadge.定位{color:#c8455f;border-color:#5a2029}
.frm .up{color:#66a9a0}
.frm .dn{color:#c9a15a}
.rankno{font-family:var(--dsp);font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap}
.rankno small{font-family:var(--txt);font-size:11px;color:var(--paper-dim);margin-left:4px}
.tier{font-family:var(--dsp);font-size:12px;letter-spacing:.06em}
.led b.num{margin-left:auto}
.led{display:grid;grid-template-columns:1fr auto 34px;align-items:baseline;gap:8px}
/* ladder */
.ladder{padding-top:18px;display:grid;gap:2px}
.tierrow{display:grid;grid-template-columns:150px 1fr;gap:18px;border-top:1px solid var(--line-soft);padding:14px 0}
.tierhead{border-left:3px solid var(--line);padding-left:12px}
.tierhead b{font-family:var(--dsp);font-size:20px;display:block}
.tierhead span{font-size:11.5px;color:var(--paper-faint)}
.tierbody{display:flex;flex-wrap:wrap;gap:6px}
.chip2{display:inline-flex;align-items:baseline;gap:7px;background:rgba(234,229,218,.03);border:1px solid var(--line);
  color:var(--paper-2);border-radius:2px;padding:5px 9px;cursor:pointer;transition:.15s var(--easing)}
.chip2:hover{border-color:var(--line-hard);color:var(--paper);background:rgba(234,229,218,.06)}
.chip2 .cn{font-size:13px}
.chip2 .cr{font-family:var(--dsp);font-size:12px;color:var(--paper-faint);font-variant-numeric:tabular-nums}
.laddernote{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.laddernote h3,.cmprels h3{font-size:12px;color:var(--paper-faint);letter-spacing:.06em;margin-bottom:8px}
.laddernote p,.cmprels p{margin:5px 0;font-size:12.5px;color:var(--paper-2)}
.relbadge{display:inline-block;border:1px solid var(--line-hard);border-radius:2px;padding:0 6px;font-size:11px;color:var(--paper-2);margin:0 2px}
.q{color:var(--paper-faint)}
/* network */
.netwrap{padding-top:16px}
.netbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.relbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line);border-radius:2px;
  color:var(--paper-faint);padding:4px 9px;font-size:12px;cursor:pointer;opacity:.5;transition:.15s var(--easing)}
.relbtn.on{opacity:1;color:var(--paper-2)}
.relbtn i{width:8px;height:8px;display:inline-block}
.netgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}
@media(max-width:1080px){.netgrid{grid-template-columns:1fr}}
.netcanvas{border:1px solid var(--line);background:rgba(234,229,218,.02)}
svg.net{display:block;width:100%;height:auto}

.rvtable td{vertical-align:middle}
.rvtag{display:inline-block;font-size:10.5px;border:1px solid var(--line-hard);border-radius:2px;padding:0 5px;margin:1px 3px 1px 0;color:var(--paper-dim)}
.rvtag.warn{border-color:#7b5a1f;color:#e0b063}

function applyLayout(){

/* 字号/字重/描边走内联 style，排版参数才能即时生效（颜色仍由 class 控） */
function textStyle(size, stroke){ return 'font-size:' + size + 'px;font-weight:700;stroke-width:' + stroke + 'px'; }
/* 标签宽度粗估（中文按 1em、拉丁按 0.62em），用来把标签钳在画布内 */
function labelWidth(name, grade){
  var w = name.length * LAYOUT.nameSize + (grade ? 4 : 0);
  if (grade) w += grade.length * (grade === 'ULTRA' ? LAYOUT.ultraSize : LAYOUT.gradeSize) * 0.62;
  return w;
}

function radar(series, size, opt){
  opt = opt || {};
  var cx = size/2, cy = size/2, parts = [];
  var MAXV = 200;
  var R = LAYOUT.R100;                         // 100 环半径（排版参数）
  var outer = R * MAXV / 100;                  // 200 的半径
  parts.push('<svg class="radar" viewBox="0 0 '+size+' '+size+'" aria-hidden="true">');
  var gpre = 'rg' + (++radarSeq) + '_';
  parts.push(gradDefs(gpre));
  function rOf(v){ return R * Math.max(0, Math.min(MAXV, v)) / 100; }   // >100 即画到 100 环外
  /* 网格：0–100 共 gridRings 圈，最外圈＝100 环 */
  var gn = LAYOUT.gridRings;
  for (var k=1;k<=gn;k++){
    var rr = R*k/gn, pts = [];
    for (var i=0;i<6;i++){ var p = polar(cx,cy,rr,i); pts.push(f1(p[0])+','+f1(p[1])); }
    parts.push('<polygon class="ring'+(k===gn?' major':'')+'" points="'+pts.join(' ')+'" style="stroke:'+withAlpha(k===gn?THEME.gridMajor:THEME.grid, k===gn?LAYOUT.ringMajorAlpha:LAYOUT.ringAlpha)+'"/>');
  }
  /* 越界上限：overflow 为 always 时恒画、auto 时只在有 >100 的数值时画、never 不画 */
  var vmax = 0;
  series.forEach(function(se){ se.vals.forEach(function(v){ if (v > vmax) vmax = v; }); });
  var over = LAYOUT.overflow === 'always' || (LAYOUT.overflow === 'auto' && vmax > 100);
  if (over && LAYOUT.overflowAlpha > 0){
    var p200 = [];
    for (var i9=0;i9<6;i9++){ var q9 = polar(cx,cy,outer,i9); p200.push(f1(q9[0])+','+f1(q9[1])); }
    parts.push('<polygon class="ring halo" points="'+p200.join(' ')+'" style="stroke:'+withAlpha(THEME.overflowLine, LAYOUT.overflowAlpha)+'"/>');
  }
  if (LAYOUT.axisAlpha > 0){
    var axisR = over ? outer : R;
    for (var i2=0;i2<6;i2++){ var pa = polar(cx,cy,axisR,i2);
      parts.push('<line class="axis" x1="'+cx+'" y1="'+cy+'" x2="'+f1(pa[0])+'" y2="'+f1(pa[1])+'" style="stroke:'+withAlpha(THEME.axis, LAYOUT.axisAlpha)+'"/>'); }
  }
  /* 数据多边形：只有描边＋填充（顶点、档位弧已按作者要求删除） */
  var isDualNow = series.length > 1 && opt.gradesAll === true;
  series.forEach(function(se, si){
    var pts = [];
    parts.push('<g class="'+(se.cls||'')+'">');
    for (var i=0;i<6;i++){ var rr = rOf(se.vals[i]); var p = polar(cx,cy,rr,i); pts.push(f1(p[0])+','+f1(p[1])); }
    var fop = opt.fillOpacity !== undefined ? opt.fillOpacity : LAYOUT.polyFill;
    parts.push('<polygon class="parea" points="'+pts.join(' ')+'" fill="'+se.color+'" fill-opacity="'+fop+'" stroke="'+se.color+'" stroke-width="'+LAYOUT.polyStroke+'"/>');
    /* 六维全 0 时多边形退化成圆心一个点（面积 0＝看不见）——补一个圆心标记，
       编辑弹窗里「正在编辑」的人形才始终有图，不会只剩被对比的那条 */
    var zmax = 0; for (var z = 0; z < 6; z++){ var zv = rOf(se.vals[z]); if (zv > zmax) zmax = zv; }
    if (opt.dotZero && zmax < 1) parts.push(
      '<circle class="pdot" cx="'+cx+'" cy="'+cy+'" r="4" fill="'+se.color+'" fill-opacity="0.9"/>'+
      '<circle class="pdot" cx="'+cx+'" cy="'+cy+'" r="9.5" fill="none" stroke="'+se.color+'" stroke-opacity="0.45" stroke-width="1.3"/>');
    if (isDualNow && opt.labels !== false) emitLabels(se.vals, se.letters);   /* 每态一套标签 */
    if (opt.values){
      for (var m=0;m<6;m++){
        var vv = rOf(se.vals[m]), lp = polar(cx,cy,Math.min(vv + 13 + si*11, R - 6), m);
        parts.push('<text class="fval" x="'+f1(lp[0])+'" y="'+f1(lp[1]+3.5)+'" text-anchor="middle">'+se.vals[m]+'</text>');
      }
    }
    parts.push('</g>');
  });
  if (opt.drag && series.length === 1){
    for (var dg = 0; dg < 6; dg++){
      var hp = polar(cx, cy, rOf(series[0].vals[dg]), dg);
      parts.push('<circle class="dragv" data-i="'+dg+'" cx="'+f1(hp[0])+'" cy="'+f1(hp[1])+'" r="11" fill="none" stroke="none"/>');
    }
  }
  /* 标签：每个维度一个「维度名 + 档位」，位置贴着该维基准半径——实时跟着图面积走
     双形态卡每态各出一套（放在各自 <g> 里），切换时由 CSS 显隐，档位文字会跟着换 */
  var blankChart = opt.blank === true;
  function emitLabels(vals, letters){
    for (var i4=0;i4<6;i4++){
      var vI = vals ? vals[i4] : 0;
      var gI = blankChart ? '待填' : (letters ? letters[i4] : letterOf(vI));
      if (opt.grades === false) gI = '';
      var wI = labelWidth(DSHORT[i4], gI);
      var angI = -Math.PI/2 + i4*Math.PI/3;
      /* 标签中心压在轴线上：沿轴的半投影只有半宽×|cos|，所以能真正贴近基准半径而不会越框 */
      var halfI = Math.max(LAYOUT.nameSize * 0.6, (wI/2) * Math.abs(Math.cos(angI)));
      /* <100 的维度一律牵制在 100 环外沿就近处（不跟着小数值往圆心收）；>100 的才沿轴向外扩 */
      var baseI = Math.max(rOf(vI), LAYOUT.R100);
      var lrI = Math.min(baseI + LAYOUT.labelPad + halfI, cx + 30 - halfI);   // >100 允许溢出画布一点，但必须跟到顶点
      var pn = polar(cx,cy,lrI,i4);
      var an = 'middle';
      var ts = '<tspan style="fill:'+THEME.nameText+';stroke-width:'+LAYOUT.nameStroke+'px">'+DSHORT[i4]+'</tspan>';
      if (gI) ts += '<tspan'+(blankChart ? '' : ' fill="'+gradeFill(gI, gpre)+'"')+' style="font-size:'+
        (blankChart ? LAYOUT.gradeSize : (gI==='ULTRA'?LAYOUT.ultraSize:LAYOUT.gradeSize))+'px;font-weight:700;stroke-width:'+
        (gI==='ULTRA'?LAYOUT.ultraStroke:LAYOUT.gradeStroke)+'px'+
        (blankChart ? ';fill:var(--paper-faint)' : (gI==='SS' ? ';stroke:#f0c53f' : ''))+'"> '+gI+'</tspan>';
      parts.push('<text class="albl" x="'+f1(pn[0])+'" y="'+f1(pn[1]+3)+'" text-anchor="'+an+'" style="font-size:'+LAYOUT.nameSize+'px;font-weight:'+LAYOUT.nameWeight+'">'+ts+'</text>');
    }
  }
  var isDual = series.length > 1 && opt.gradesAll === true;
  if (opt.labels !== false && !isDual) emitLabels(series[0] ? series[0].vals : null, series[0] ? series[0].letters : null);
  parts.push('</svg>');
  return parts.join('');
}

/* ---------- 过滤 ---------- */
function filtered(){
  var k = state.q.trim().toLowerCase();
  var arr = state.entries.filter(function(e){
    if (state.side && e.side !== state.side) return false;
    if (state.fac && e.faction !== state.fac) return false;
    if (state.src && e.src !== state.src) return false;
    if (state.frame && e.frame !== state.frame) return false;
    if (!k) return true;
    return [e.name,e.faction,e.cls,e.weapon,e.basis,e.src].join(' ').toLowerCase().indexOf(k) >= 0;
  });
  var s = state.sort;
  if (s === 'name') arr.sort(function(a,b){ return a.name.localeCompare(b.name,'zh'); });
  else if (s === 'rank' || s === 'total') arr.sort(function(a,b){ return totalOf(b) - totalOf(a); });
  else if (s === 'rankAsc') arr.sort(function(a,b){ return totalOf(a) - totalOf(b); });
  else if (s === 'total') arr.sort(function(a,b){ return totalOf(b) - totalOf(a) || b.rank - a.rank; });
  else if (s === 'totalAsc') arr.sort(function(a,b){ return totalOf(a) - totalOf(b) || b.rank - a.rank; });
  else if (s === 'faction') arr.sort(function(a,b){ return a.faction.localeCompare(b.faction,'zh') || b.rank - a.rank; });
  else if (s.length === 2 && s.charAt(0) === 'f'){ var i = parseInt(s.charAt(1),10);
    arr.sort(function(a,b){ return b.s[i] - a.s[i] || b.rank - a.rank; }); }
  else arr.sort(function(a,b){ return totalOf(b) - totalOf(a); });
  return arr;
}

/* ---------- 关系网 ---------- */
function nodeSet(){
  var map = {};
  state.edges.forEach(function(ed){
    [ed.a, ed.b].forEach(function(n){
      if (!map[n]) {
        var real = byName(n);
        map[n] = { name:n, real: real ? real.id : null, rank: real ? real.rank : null, group: n.indexOf('+') >= 0, inEdges:0 };
      }
      map[n].inEdges++;
    });
  });
  var arr = Object.keys(map).map(function(k){ return map[k]; });
  // 虚拟节点排名取邻居均值
  arr.forEach(function(n){
    if (n.rank !== null) return;
    var ns = [];
    state.edges.forEach(function(ed){
      if (ed.a === n.name) { var o = map[ed.b]; if (o && o.rank !== null) ns.push(o.rank); }
      if (ed.b === n.name) { var o2 = map[ed.a]; if (o2 && o2.rank !== null) ns.push(o2.rank); }
    });
    n.rank = ns.length ? Math.round(ns.reduce(function(a,b){ return a+b; },0)/ns.length) : 40;
  });
  return arr;
}
function networkSVG(){
  var nodes = nodeSet();
  var W = 1180, H = 760, pad = 70;
  var ranks = nodes.map(function(n){ return n.rank; });
  var lo = Math.min.apply(null, ranks.concat([28])), hi = Math.max.apply(null, ranks.concat([99]));
  nodes.sort(function(a,b){ return a.rank - b.rank; });
  var H2 = 760;
  nodes.forEach(function(n, i){
    n.x = pad + (n.rank - lo) / Math.max(1, hi - lo) * (W - pad*2);
    n.y = 46 + ((i * 149) % (H2 - 120));
    n.up = (i % 2) === 0;
  });
  var pos = {}; nodes.forEach(function(n){ pos[n.name] = n; });
  var vis = state.edges.filter(function(ed){
    if (state.relFilter[ed.rel] === false) return false;
    if (state.kindFilter[ed.kind] === false) return false;
    return true; });
  var h = ['<svg class="net" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'];
  h.push('<line class="axis" x1="'+pad+'" y1="'+H-26+'" x2="'+(W-pad)+'" y2="'+H-26+'"/>');
  h.push('<text class="netax" x="'+pad+'" y="'+(H-8)+'">低 '+(lo)+'</text>');
  h.push('<text class="netax" x="'+(W-pad)+'" y="'+(H-8)+'" text-anchor="end">总分 '+(hi)+' 高</text>');
  vis.forEach(function(ed){
    var a = pos[ed.a], b = pos[ed.b]; if (!a || !b) return;
    var dim = state.node && ed.a !== state.node && ed.b !== state.node;
    var col = RELC[ed.rel] || '#8b98a8';
    var solid = ed.kind === '实战' || ed.kind === '定位';
    var mx = (a.x + b.x)/2, my = (a.y + b.y)/2 - 42;
    var d = 'M '+f1(a.x)+' '+f1(a.y)+' Q '+f1(mx)+' '+f1(my)+' '+f1(b.x)+' '+f1(b.y);
    h.push('<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+(solid?1.5:1)+'" stroke-dasharray="'+(solid?'':'4 3')+'" stroke-opacity="'+(dim?0.1:(solid?0.6:0.4))+'" marker-end="url(#ar)"/>');

function reviewFlags(e){
  var t = [], w = 0;
  if (!e.frame) { t.push(['素体未标注','warn']); w += 3; }
  if ((e.ev||0) < 60) { t.push(['证据少 '+(e.ev||0)+' 条','warn']); w += 3; }
  if (e.surge !== null && e.surge !== undefined && e.surge >= 20) { t.push(['超出基线 +'+e.surge,'']); w += 3; }
  if (e.surge !== null && e.surge !== undefined && e.surge <= -18) { t.push(['低于基线 '+e.surge,'bad']); w += 3; }
  if (e.conf === '待考') { t.push(['阵营待考','warn']); w += 2; }
  if (!e.brand) { t.push(['烙印空','']); w += 1; }
  if (e.brand === '（待考）') { t.push(['烙印冲突','warn']); w += 1; }
  if (!state.edges.some(function(ed){ return ed.a === e.name || ed.b === e.name; })) { t.push(['无关系边','']); w += 1; }
  return { tags:t, weight:w };
}
function rvOf(id, kind, i){

function buildSliderBlock(boxId, vals, use, key, onInput){

  box.innerHTML = DIMS.map(function(dim,i){
    return '<div class="srow"><label for="'+key+i+'">'+dim+'</label>'+
      '<input id="'+key+i+'" type="range" min="0" max="200" step="1" value="'+vals[i]+'" data-i="'+i+'">'+
      '<output data-i="'+i+'">'+vals[i]+' '+letterOf(vals[i])+'</output>'+
      '<label style="font-size:11px;color:var(--paper-dim);display:flex;align-items:center;gap:4px"><input type="checkbox" data-use="'+i+'"'+(use[i]?' checked':'')+'> 参与总分</label></div>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('input[type=range]'), function(r){
    r.addEventListener('input', function(){
      var i = parseInt(r.getAttribute('data-i'),10); vals[i] = parseInt(r.value,10);
      paintOutput(box, i, vals[i]);
      onInput();
    });
  });
  DIMS.forEach(function(_, i){ paintOutput(box, i, vals[i]); });
  Array.prototype.forEach.call(box.querySelectorAll('input[data-use]'), function(cb){
    cb.addEventListener('change', function(){ use[parseInt(cb.getAttribute('data-use'),10)] = cb.checked; onInput(); });
  });
}
function paintOutput(box, i, v){
  var o = box.querySelector('output[data-i="'+i+'"]'); if (!o) return;
  o.textContent = v + ' ' + letterOf(v);
  o.style.color = GCOLOR[GRADES.indexOf(letterOf(v))];
}

/* ---------- 编辑时的实时对比：左边画草稿，右边可选一个参照 ---------- */
var mCmpId = '';
function cmpOptions(){
  var real = state.entries.filter(function(e){ return !isBlank(e) && e.id !== editId; });   /* 不列正在编辑的这一条（自己跟自己比没意义） */
  if (!real.length) return '<option value="">（暂无可对比对象：先给某个人形填数值）</option>';
  return '<option value="">（不对比）</option><option value="__avg">全体平均（'+real.length+' 人）</option>' +
    real.sort(function(a,b){ return b.total - a.total; }).map(function(e){
      return '<option value="'+e.id+'">'+esc(e.name)+'（'+e.total+' '+e.tier+'）</option>';
    }).join('');
}
/* 排名池＝库里「非空卡」但排除正在编辑的那条（避免自己跟自己并列）＋草稿自己的实时数值。
   旧版分子分母分开统计，空卡编辑时会出现「第 4/3 高」这种 N>M 的错；现在两者同池。 */
function rankPool(i){
  var arr = state.entries.filter(function(e){ return !isBlank(e) && e.id !== editId; })
    .map(function(e){ return i === null ? e.total : e.s[i]; });
  arr.push(i === null ? totalOf({ s: mS, use: mUse }) : mS[i]);
  return arr.sort(function(a,b){ return b - a; });
}
function rankText(v, pool){
  return '第 ' + (pool.filter(function(x){ return x > v; }).length + 1) + '/' + pool.length + ' 高';
}
function renderMChart(){
  if (!q('mChart')) return;
  var draft = { vals: mS.slice(), color: '#c8455f', letters: mS.map(letterOf) };
  var ref = null, refName = '';
  if (mCmpId === '__avg'){
    var real = state.entries.filter(function(e){ return !isBlank(e); });
    var av = DIMS.map(function(_,i){ return Math.round(real.reduce(function(a,e){ return a + e.s[i]; },0) / Math.max(1,real.length)); });
    ref = { vals: av, color: '#5fb3b0' }; refName = '全体平均';
  } else if (mCmpId){
    var e = byId(mCmpId);
    if (e){ ref = { vals: e.s, color: '#9fb8e0' }; refName = e.name; }
  }
  var blankDraft = isBlank({ s: mS });      /* 还没填数值的草稿：图里只收在圆心，数字区跟着显示「待填」 */
  var draftTotal = totalOf({ s: mS, use: mUse });
  /* 「总分（自动）」跟着滑条实时刷新；空卡显示「—」而不是 0（旧版只在打开弹窗那一刻写一次） */
  if (q('mRank')) q('mRank').value = blankDraft ? '—' : String(draftTotal);
  q('mChart').innerHTML = radar(ref ? [ref, draft] : [draft], 290, { grades: !ref, drag: !ref, dotZero: true }) +
    '<div class="q" style="text-align:center;font-size:10.5px;margin-top:2px">' +
    (ref ? '<span style="color:'+ref.color+'">■ '+esc(refName)+'</span>　' : '') +
    '<span style="color:#c8455f">■ 正在编辑</span></div>' +
    (blankDraft ? '<div class="chartnote">正在编辑的人形六维还全是 0（待填）——图形收在圆心（红点），拖动下面的滑条就会出多边形</div>' : '');
  if (blankDraft){
    q('mStat').innerHTML = '总分 <b>—</b>　<span style="color:var(--paper-faint)">待填</span>　<span class="q">（这张卡还没填数值）</span><br>' +
      DIMS.map(function(d,i){ return DSHORT[i] + '　<span style="color:var(--paper-faint)">— 待填</span>'; }).join('<br>');
  } else {
    q('mStat').innerHTML = '总分 <b>' + draftTotal + '</b>　' + letterOf(draftTotal) + '　（' + rankText(draftTotal, rankPool(null)) + '）<br>' +
      DIMS.map(function(d,i){ return DSHORT[i] + '　' + mS[i] + '　' + (mUse[i] === false ? '<span style="color:#c9a15a">不计</span>' : rankText(mS[i], rankPool(i))); }).join('<br>');
  }
}

function download(name, text, mime){
  var blob = new Blob([text], { type: mime || 'application/json;charset=utf-8' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}
function csvCell(v){ v = String(v==null?'':v); return '"' + v.split('"').join('""') + '"'; }
function exportJSON(){ download('少前2_人形六维数据.json', JSON.stringify({ entries: state.entries, edges: state.edges }, null, 1)); }
function exportCSV(){
  var head = ['名称','小队/归属','立场','剧情出处','可信度','总分','梯队','剧情依据'].concat(DIMS.map(function(d){ return d+'(0-100)'; })).concat(DIMS.map(function(d){ return d+'(档)'; }));
  var rows = [head.map(csvCell).join(',')];
  state.entries.forEach(function(e){
    rows.push([e.name,e.faction,e.side==='foe'?'敌方人形':'自机人形',e.src,e.conf,e.total,e.tier,e.basis]

function normalize(arr){
  if (!Array.isArray(arr)) return null;
  var out = [];
  for (var i=0;i<arr.length;i++){
    var e = arr[i]; if (!e || !e.name || !Array.isArray(e.s) || e.s.length !== 6) continue;
    var rank = Math.max(0, Math.min(200, Math.round(Number(e.rank) || 0)));
    out.push({ id:e.id||uid(), name:String(e.name), faction:String(e.faction||''), cls:String(e.cls||''), weapon:String(e.weapon||''),
      brand:String(e.brand||''), frame:String(e.frame||''), side:(e.side==='foe'?'foe':'self'), src:String(e.src||''),
      conf:(e.conf==='待考'?'待考':'官方'), basis:String(e.basis||''), rank, tier:letterOf(rank),
      s:e.s.map(function(v){ v = Math.round(Number(v)||0); return Math.max(0, Math.min(200, v)); }), total:0,
      use:Array.isArray(e.use)?e.use.slice(0,6).map(function(u){ return u !== false; }):[true,true,true,true,true,true] });
  }
  return out.length ? out : null;
}

var dragCtx = null;
function radarGeom(svg){ var s = svg.viewBox.baseVal.width || 300, c = s / 2; return { cx:c, cy:c, R:(c - 12) * 0.5 }; }
function svgLocal(svg, ev){ var m = svg.getScreenCTM(); if (!m) return { x:0, y:0 };
  var p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
  var q = p.matrixTransform(m.inverse()); return { x:q.x, y:q.y }; }
function dragVal(g, i, p){ var a = -Math.PI/2 + i*Math.PI/3;
  var proj = (p.x - g.cx) * Math.cos(a) + (p.y - g.cy) * Math.sin(a);
  return Math.max(0, Math.min(200, Math.round(proj / g.R * 100))); }
function startDrag(svg, i, plate, sheet, ev){
  dragCtx = { i:i, plate:plate, sheet:sheet, id: plate ? plate.id.replace(/^card-/, '') : null };

function dragMove(ev){

  var svg = el ? el.querySelector('svg.radar') : (dragCtx.sheet && q('mChart') ? q('mChart').querySelector('svg.radar') : null);
  if (!svg) return;
  var v = dragVal(radarGeom(svg), dragCtx.i, svgLocal(svg, ev));
  if (dragCtx.plate){
    var e = byId(dragCtx.id); if (!e || e.s[dragCtx.i] === v) return;
    e.s[dragCtx.i] = v; syncLetters();

    el.parentNode.replaceChild(tmp.firstChild, el);

    if (mS[dragCtx.i] === v) return;
    mS[dragCtx.i] = v;

    var o = box.querySelector('output[data-i="'+dragCtx.i+'"]');

/* 所有 number 输入框都支持滚轮微调（含 0–200 限制与 step） */
document.addEventListener('wheel', function(ev){
  var t = ev.target;
  if (!t || t.tagName !== 'INPUT' || t.type !== 'number' || t.readOnly) return;
  var step = parseFloat(t.step) || 1;
  var v = parseFloat(t.value); if (isNaN(v)) v = parseFloat(t.min) || 0;
  v += (ev.deltaY < 0 ? step : -step);
  var mn = (t.min === '' ? -Infinity : parseFloat(t.min)), mx = (t.max === '' ? Infinity : parseFloat(t.max));
  v = Math.max(mn, Math.min(mx, Math.round(v * 1000) / 1000));
  t.value = v;
  t.dispatchEvent(new Event('input', { bubbles:true }));
  t.dispatchEvent(new Event('change', { bubbles:true }));
  ev.preventDefault();
}, { passive:false });

function applyHash(){
  var h = (location.hash || '').replace('#','');
